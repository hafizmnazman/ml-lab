name: Run worked labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create course environment
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/setup.ps1 -UseLock
      - name: Execute both notebooks
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/run_labs.py
      - name: Verify results and saved predictor
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/verify.py
